<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reporte VialScan</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap">
<style>
  :root { --texto: #16181d; --suave: #5b616b; --borde: #d9dce1; --azul: #2f7bf6; --rojo: #d63c41; --amarillo: #c99a06; --verde: #2f9e44; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #eef0f3; color: var(--texto); font: 13px/1.45 "Inter", system-ui, sans-serif; }
  .barra { position: sticky; top: 0; display: flex; gap: 10px; justify-content: flex-end; padding: 10px 16px; background: #1c1d20; }
  .barra button { height: 36px; padding: 0 16px; border-radius: 8px; border: 0; font: inherit; font-weight: 600; cursor: pointer; }
  .barra .primario { background: var(--azul); color: #fff; }
  .hoja { max-width: 900px; margin: 20px auto; background: #fff; padding: 36px 40px; box-shadow: 0 2px 12px rgba(0,0,0,.08); }
  header { display: flex; justify-content: space-between; align-items: flex-start; border-bottom: 2px solid var(--texto); padding-bottom: 14px; margin-bottom: 20px; }
  .marca { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 18px; }
  .logo { width: 30px; height: 30px; border-radius: 7px; background: var(--azul); display: grid; place-items: center; }
  h1 { font-size: 20px; margin: 0 0 4px; } h2 { font-size: 15px; margin: 26px 0 10px; }
  .suave { color: var(--suave); }
  .resumen { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .kpi { border: 1px solid var(--borde); border-radius: 8px; padding: 10px 12px; }
  .kpi b { font-size: 22px; display: block; }
  .fotos { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .foto { break-inside: avoid; border: 1px solid var(--borde); border-radius: 8px; overflow: hidden; }
  .foto .img { position: relative; }
  .foto img { width: 100%; display: block; }
  .foto p { margin: 0; padding: 6px 10px; font-size: 11.5px; color: var(--suave); }
  .caja { position: absolute; border: 2px solid var(--c); }
  .caja span { position: absolute; left: -2px; top: -2px; transform: translateY(-100%); background: var(--c); color: #111; font-size: 9px; font-weight: 800; padding: 0 4px; white-space: nowrap; }
  table { width: 100%; border-collapse: collapse; font-size: 11.5px; }
  th, td { text-align: left; padding: 6px 6px; border-bottom: 1px solid var(--borde); vertical-align: top; }
  th { background: #f4f5f7; font-weight: 600; }
  .sev { font-weight: 700; }
  footer { margin-top: 26px; font-size: 11px; color: var(--suave); border-top: 1px solid var(--borde); padding-top: 10px; }
  a { color: var(--azul); }
  @media print {
    body { background: #fff; } .barra { display: none; } .hoja { box-shadow: none; margin: 0; padding: 0; max-width: none; }
    @page { margin: 14mm; }
    tr { break-inside: avoid; }
  }
</style>
</head>
<body>
<div class="barra"><button onclick="window.close()">Cerrar</button><button class="primario" onclick="window.print()">Imprimir / Guardar PDF</button></div>
<div class="hoja" id="hoja"><p>Cargando reporte…</p></div>
<script src="/js/api.js"></script>
<script>
(async () => {
  const q = new URLSearchParams(location.search), hoja = document.getElementById("hoja");
  if (!Sesion.token) { hoja.innerHTML = "<p>Inicia sesión en el panel para ver este reporte.</p>"; return; }
  let rec, meta;
  try {
    if (q.get("id")) {
      const r = await api(`/api/reportes/${q.get("id")}`);
      rec = r.recorrido;
      meta = `Reporte #${r.id} · guardado por ${esc(r.autor)} el ${Fmt.fecha(r.creado)}`;
    } else {
      rec = await api(`/api/recorridos/${q.get("recorrido")}`);
      meta = `Estado actual · generado por ${esc(Sesion.usuario?.nombre || "")} el ${Fmt.fecha(new Date().toISOString())}`;
    }
  } catch (e) { hoja.innerHTML = `<p>${esc(e.message)}</p>`; return; }

  const danos = rec.danos, cuenta = f => danos.filter(f).length;
  const fotos = rec.lista_fotogramas.filter(f => f.imagen && danos.some(d => d.fotograma_id === f.id && d.caja));
  const colores = { alta: "#d63c41", media: "#e0ad12", baja: "#2f9e44" };
  hoja.innerHTML = `
    <header><div><div class="marca"><span class="logo"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M12 8v8M8 12h8"/></svg></span>VialScan AI</div>
      <div class="suave" style="margin-top:4px">Panel de mantenimiento vial</div></div>
      <div style="text-align:right"><h1>Reporte de daños viales</h1><div class="suave">${meta}</div></div></header>
    <div><b style="font-size:16px">${esc(rec.nombre)}</b> <span class="suave">(${esc(rec.codigo)})</span><br>
      <span class="suave">${esc([rec.canton, rec.provincia].filter(Boolean).join(", "))} · ${Fmt.coord(rec.lat, rec.lon)} · ${Fmt.estadoRecorrido(rec.estado)}</span></div>
    <h2>Resumen</h2>
    <div class="resumen">
      <div class="kpi"><b>${danos.length}</b>daños detectados</div>
      <div class="kpi"><b style="color:var(--rojo)">${cuenta(d => d.severidad === "alta")}</b>severidad alta</div>
      <div class="kpi"><b>${cuenta(d => d.estado === "asignado")}</b>asignados a cuadrilla</div>
      <div class="kpi"><b style="color:var(--verde)">${cuenta(d => d.estado === "reparado")}</b>reparados</div>
    </div>
    ${fotos.length ? `<h2>Evidencia de la cámara</h2><div class="fotos">${fotos.map(f => `<div class="foto"><div class="img"><img src="${esc(f.imagen)}" alt="">
      ${danos.filter(d => d.fotograma_id === f.id && d.caja).map(d => `<div class="caja" style="--c:${colores[d.severidad] || "#8b8f97"};left:${d.caja[0] * 100}%;top:${d.caja[1] * 100}%;width:${d.caja[2] * 100}%;height:${d.caja[3] * 100}%"><span>${esc(d.codigo)}</span></div>`).join("")}
      </div><p>${Fmt.coord(f.lat, f.lon)}${f.velocidad != null ? ` · ${Math.round(f.velocidad)} km/h` : ""} · ${Fmt.fecha(f.fecha)}</p></div>`).join("")}</div>` : ""}
    <h2>Detalle de daños</h2>
    <table><thead><tr><th>Código</th><th>Tipo</th><th>Severidad</th><th>Origen</th><th>Tamaño (cm)</th><th>Prof.</th><th>Estado</th><th>Cuadrilla</th><th>Ubicación</th><th>Zona / IP</th></tr></thead>
      <tbody>${danos.map(d => `<tr><td><b>${esc(d.codigo)}</b></td><td>${Fmt.tipo(d.tipo)}</td>
        <td class="sev" style="color:${colores[d.severidad] || "inherit"}">${Fmt.severidad(d.severidad)}</td>
        <td>${d.origen === "manual" ? "Manual" : `IA ${Fmt.pct(d.confianza)}`}</td>
        <td>${d.largo_cm == null && d.ancho_cm == null ? "—" : `${Fmt.cm(d.largo_cm)} × ${Fmt.cm(d.ancho_cm)}`}</td><td>${Fmt.cm(d.profundidad_cm)}</td>
        <td>${Fmt.estadoDano(d)}</td><td>${esc(d.cuadrilla || "—")}</td>
        <td>${d.lat != null ? `<a href="${GMaps.abrir(d)}">${Fmt.coord(d.lat, d.lon)}</a>` : "—"}</td>
        <td>${esc([d.canton, d.provincia].filter(Boolean).join(", ") || "—")}${d.ip_publica ? `<br><span class="suave">IP ${esc(d.ip_publica)}</span>` : ""}</td></tr>`).join("")
        || `<tr><td colspan="10" class="suave">Sin daños registrados.</td></tr>`}</tbody></table>
    <footer>Generado con VialScan AI · Las ubicaciones enlazan a Google Maps.</footer>`;

  if (q.get("imprimir")) {
    const imgs = [...hoja.querySelectorAll("img")];
    await Promise.all(imgs.map(i => i.complete ? null : new Promise(r => { i.onload = i.onerror = r; })));
    setTimeout(() => window.print(), 300);
  }
})();
</script>
</body>
</html>
